# inventory の雛形。inventory/<環境名>/ に複製し、値を環境に合わせて書き換えて使う。
#   cp -r inventory/example inventory/production
# ansible.cfg の既定は inventory/production。別の名前にした場合は実行時に -i で指定する。
# ansible_host は ssh config の Host 名。ノードの IP はここに書かない（facts から導出される）。
# compute を増やすときは compute グループにホストを追記する。
all:
  children:
    openstack:
      children:
        controller:
          hosts:
            openstack-cc:
              ansible_host: example-cc
        compute:
          hosts:
            openstack-node1:
              ansible_host: example-node1
            openstack-node2:
              ansible_host: example-node2
    repo:
      hosts:
        openstack-repo:
          ansible_host: example-repo

  vars:
    ansible_user: rocky
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
