---
- name: Gather node facts for address derivation
  ansible.builtin.import_playbook: gather_node_facts.yml

- name: "Prepare 2: Base image creation and verification"
  hosts: controller
  become: true
  tasks:
    - name: Create keypair
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack keypair show key-for-test >/dev/null 2>&1 && echo EXISTS || \
        openstack keypair create key-for-test > /root/key-for-test.pem
      register: keypair_result
      changed_when: "'EXISTS' not in keypair_result.stdout"

    - name: Set keypair file permissions
      ansible.builtin.file:
        path: /root/key-for-test.pem
        mode: "0600"

    - name: Verify keypair type
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack keypair show key-for-test -f value -c type
      register: keypair_type
      changed_when: false
      failed_when: keypair_type.stdout.strip() != 'ssh'

    - name: Deploy userdata file
      ansible.builtin.template:
        src: userdata_rocky9_base.txt.j2
        dest: /root/userdata_rocky9_base.txt
        mode: "0644"

    - name: Launch work VM with userdata
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server show rocky9-base-work >/dev/null 2>&1 && echo EXISTS || \
        openstack server create \
          --flavor m1.small \
          --image rocky9-orig \
          --network private \
          --key-name key-for-test \
          --user-data /root/userdata_rocky9_base.txt \
          --wait \
          rocky9-base-work
      register: vm_create_result
      changed_when: "'EXISTS' not in vm_create_result.stdout"

    - name: Wait for VM to shut down
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server show rocky9-base-work -f value -c status
      register: vm_status
      until: vm_status.stdout.strip() == 'SHUTOFF'
      retries: 40
      delay: 30
      changed_when: false

    - name: Create image from stopped VM
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack image show rocky9-base >/dev/null 2>&1 && echo EXISTS || \
        openstack server image create --name rocky9-base --wait rocky9-base-work
      register: image_create
      changed_when: "'EXISTS' not in image_create.stdout"

    - name: Verify rocky9-base image status
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack image show rocky9-base -f value -c status
      register: base_image_status
      changed_when: false
      failed_when: base_image_status.stdout.strip() != 'active'

    - name: Set rocky9-base image to public and protected
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack image set --public --protected rocky9-base
      changed_when: true

    - name: Delete work VM
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server show rocky9-base-work >/dev/null 2>&1 && \
        openstack server delete rocky9-base-work || true
      changed_when: true

    - name: Launch test VM from base image
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server show rocky9-base-test >/dev/null 2>&1 && echo EXISTS || \
        openstack server create \
          --flavor m1.small \
          --image rocky9-base \
          --network private \
          --key-name key-for-test \
          --wait \
          rocky9-base-test
      register: test_vm_result
      changed_when: "'EXISTS' not in test_vm_result.stdout"

    - name: Create floating IP
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack floating ip create public -f value -c floating_ip_address
      register: fip_result
      changed_when: true

    - name: Assign floating IP to test VM
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server add floating ip rocky9-base-test {{ fip_result.stdout.strip() }}
      changed_when: true

    - name: Wait for VM to boot
      ansible.builtin.pause:
        seconds: 30

    - name: Verify SSH connectivity
      ansible.builtin.shell: |
        ssh -i /root/key-for-test.pem -o StrictHostKeyChecking=no rocky@{{ fip_result.stdout.strip() }} hostname
      register: ssh_hostname
      changed_when: false
      retries: 5
      delay: 10
      until: ssh_hostname.rc == 0

    - name: Verify /etc/hosts contains reposerver
      ansible.builtin.shell: |
        ssh -i /root/key-for-test.pem -o StrictHostKeyChecking=no rocky@{{ fip_result.stdout.strip() }} grep reposerver /etc/hosts
      register: hosts_check
      changed_when: false
      failed_when: "'reposerver-rocky9' not in hosts_check.stdout"

    - name: Verify local repositories
      ansible.builtin.shell: |
        ssh -i /root/key-for-test.pem -o StrictHostKeyChecking=no rocky@{{ fip_result.stdout.strip() }} sudo dnf repolist
      register: repolist
      changed_when: false

    - name: Delete test VM
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack server show rocky9-base-test >/dev/null 2>&1 && \
        openstack server delete --wait rocky9-base-test && echo DELETED || echo NOTFOUND
      register: test_vm_delete
      changed_when: "'DELETED' in test_vm_delete.stdout"

    - name: Release floating IP
      ansible.builtin.shell: |
        source /root/keystonerc_admin
        openstack floating ip delete {{ fip_result.stdout.strip() }}
      changed_when: true

    - name: Display test results
      ansible.builtin.debug:
        msg:
          - "Keypair type: {{ keypair_type.stdout.strip() }}"
          - "VM shutdown: {{ vm_status.stdout.strip() }}"
          - "Base image status: {{ base_image_status.stdout.strip() }}"
          - "Floating IP: {{ fip_result.stdout.strip() }}"
          - "SSH hostname: {{ ssh_hostname.stdout.strip() }}"
          - "Hosts file: {{ hosts_check.stdout.strip() }}"
          - "Repo count: {{ repolist.stdout_lines | length }} lines"
          - "Test VM cleanup: {{ test_vm_delete.stdout }}"
